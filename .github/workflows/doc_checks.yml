name: Documentation check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc_checks:
    runs-on: ubuntu-latest
    # The docs group pulls the private flaQship theme via a repository
    # secret, and secrets are not exposed to pull requests from forks, so
    # those runs would fail at `uv sync`. Skip them: a skipped job still
    # reports a conclusion and satisfies a required status check.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Authenticate to the private theme repository
        env:
          THEME_DEPLOY_KEY: ${{ secrets.THEME_DEPLOY_KEY }}
          THEME_REPO: flaqship/flaqship-sphinx-theme
        run: |
          mkdir -p ~/.ssh
          echo "$THEME_DEPLOY_KEY" > ~/.ssh/theme_key
          chmod 600 ~/.ssh/theme_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/theme_key -o IdentitiesOnly=yes"
          # uv reads the https URL from uv.lock, so route just that one repo over SSH.
          git config --global "url.git@github.com:$THEME_REPO.insteadOf" "https://github.com/$THEME_REPO"
          git ls-remote "https://github.com/$THEME_REPO" HEAD > /dev/null
          echo "theme repository reachable"

      - name: Install dependencies
        run: uv sync --all-extras --group docs

      - name: Build documentation
        working-directory: docs/
        run: uv run sphinx-build -b html . _build -W --keep-going
