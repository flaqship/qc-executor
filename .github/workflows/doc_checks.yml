name: Documentation check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc_checks:
    runs-on: ubuntu-latest
    # The docs group pulls the private flaQship theme via a repository
    # secret, and secrets are not exposed to pull requests from forks, so
    # those runs would fail at `uv sync`. Skip them: a skipped job still
    # reports a conclusion and satisfies a required status check.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Authenticate to the private theme repository
        env:
          PULL_THEME_TOKEN: ${{ secrets.PULL_THEME_TOKEN }}
          THEME_REPO: github.com/flaqship/flaqship-sphinx-theme
        run: >-
          git config --global
          "url.https://x-access-token:${PULL_THEME_TOKEN}@${THEME_REPO}.insteadOf"
          "https://${THEME_REPO}"

      - name: Install dependencies
        run: uv sync --all-extras --group docs

      - name: Build documentation
        working-directory: docs/
        run: uv run sphinx-build -b html . _build -W --keep-going
