name: Elaborate Tests

# Triggered when a maintainer adds the 'run-elaborate-tests' label to a PR,
# and on every subsequent commit (synchronize) while the label is still present.
# Also runs nightly on the default branch.
on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest_full:
    name: Tests + Examples on ubuntu-latest with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Only run for PRs from the same repo (not untrusted forks) with the label set.
    # Nightly schedule bypasses the PR label check.
    if: |
      github.event_name == 'schedule' ||
      (
        contains(github.event.pull_request.labels.*.name, 'run-elaborate-tests') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group examples

      - name: Test with pytest
        run: uv run pytest tests/

      - name: Test examples
        run: uv run pytest --nbmake --nbmake-timeout 600 examples/

  pytest_windows:
    name: Tests on windows-latest with Python ${{ matrix.python-version }}
    runs-on: windows-latest
    if: |
      github.event_name == 'schedule' ||
      (
        contains(github.event.pull_request.labels.*.name, 'run-elaborate-tests') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test with pytest
        run: uv run pytest tests/

  pytest_macos:
    name: Tests on macos-latest with Python ${{ matrix.python-version }}
    runs-on: macos-latest
    if: |
      github.event_name == 'schedule' ||
      (
        contains(github.event.pull_request.labels.*.name, 'run-elaborate-tests') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test with pytest
        run: uv run pytest tests/

  pytest_qiskit_versions:
    name: Tests with Qiskit ${{ matrix.qiskit-version }} on ubuntu-latest (Python 3.12)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (
        contains(github.event.pull_request.labels.*.name, 'run-elaborate-tests') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    strategy:
      fail-fast: false
      matrix:
        qiskit-version:
          - "qiskit==1.0.0"       # earliest supported
          - "qiskit<2"            # latest Qiskit 1.x
          - "qiskit"              # latest (Qiskit 2.x)

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pin Qiskit version
        run: uv pip install '${{ matrix.qiskit-version }}'

      - name: Show Qiskit version
        run: uv run python -c "import qiskit; print(f'Qiskit {qiskit.__version__}')"

      - name: Test with pytest
        run: uv run pytest tests/