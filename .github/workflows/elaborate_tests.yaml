name: Elaborate Tests

on:
  pull_request:
    types: [review_requested]
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest_full:
    name: Tests + Examples on ubuntu-latest with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group examples

      - name: Test with pytest
        run: uv run pytest tests/

      - name: Test examples
        run: uv run pytest --nbmake --nbmake-timeout 600 examples/

  pytest_windows:
    name: Tests on windows-latest with Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test with pytest
        run: uv run pytest tests/

  pytest_macos:
    name: Tests on macos-latest with Python ${{ matrix.python-version }}
    runs-on: macos-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test with pytest
        run: uv run pytest tests/
