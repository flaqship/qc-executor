name: Close stale issues and PRs

on:
  schedule:
    - cron: "0 3 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity for 30 days. It will be closed in 365 days if no further
            activity occurs. If this is still relevant, please leave a comment.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity for 30 days. It will be closed in 365 days if no
            further activity occurs. Please rebase and update if you intend to
            continue working on it.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security,in-progress"
          days-before-stale: 30
          days-before-close: 365
