[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "executor"
description = "Abstraction layer for quantum circuits and operators across multiple backends."
readme = "README.md"
authors = [
    {name = "David Kreplin", email = "david.kreplin@ipa.fraunhofer.de"},
    {name = "Moritz Willmann", email = "moritz.willmann@ipa.fraunhofer.de"},
    {name = "Jan Schnabel", email = "jan.schnabel@ipa.fraunhofer.de"},
    {name = "Manuel Hagelüken", email = "manuel.hagelueken@ipa.fraunhofer.de"},
    {name = "Marco Roth", email = "marco.roth@ipa.fraunhofer.de"},
]
maintainers = [
    {name = "David Kreplin", email = "david.kreplin@ipa.fraunhofer.de"},
    {name = "Moritz Willmann", email = "moritz.willmann@ipa.fraunhofer.de"},
]
license = {file = "LICENSE.txt"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["quantum", "circuit", "executor", "pennylane", "qiskit", "qulacs"]
dependencies = [
    "dill>=0.3.4",
    "mapomatic>=0.10.0",
    "numpy>=1.20",
    "qiskit>=1.0.0",
    "sympy>=1.8",
]
requires-python = ">=3.10"
dynamic = ["version"]

[project.optional-dependencies]
pennylane = ["pennylane>=0.34.0"]
qulacs = ["qulacs>=0.6.4.1"]
qiskit-full = ["qiskit-aer>=0.12.0", "qiskit-ibm-runtime>=0.18.0"]
pauli_propagation = []
all = [
    "pennylane>=0.34.0",
    "qulacs>=0.6.4.1",
    "qiskit-aer>=0.12.0",
    "qiskit-ibm-runtime>=0.18.0",
]

[project.entry-points."executor.backends"]
pennylane = "executor.pennylane:PennyLaneExecutor"
qiskit = "executor.qiskit:QiskitExecutor"
qulacs = "executor.qulacs:QulacsExecutor"
pauli_propagation = "executor.pauli_propagation:PauliPropagationExecutor"

[dependency-groups]
dev = [
    "black[jupyter]",
    "pylint",
    "pytest",
    "nbmake",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
]
examples = [
    "nbmake",
    "jupyter",
    "matplotlib",
    "pylatexenc",
    "qulacsvis>=0.7.6",
    "scikit-learn>=1.7.2",
]

[tool.uv]
managed = true

[tool.hatch.version]
path = "src/executor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/executor"]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pylint]
max-line-length = 99

[tool.pylint.main]
extension-pkg-allow-list = [
    "numpy",
    "qulacs",
]

[tool.pylint."messages control"]
disable = [
    # Convention checks
    "missing-module-docstring",      # C0114
    "missing-class-docstring",       # C0115
    "missing-function-docstring",    # C0116
    "line-too-long",                 # C0301 - enforced by black
    "too-many-lines",                # C0302
    "invalid-name",                  # C0103 - short names common in math/quantum code
    "wrong-import-position",         # C0413 - needed for conditional imports
    "useless-import-alias",          # C0414
    "import-outside-toplevel",       # C0415 - lazy imports for optional deps
    "singleton-comparison",          # C0121
    "ungrouped-imports",             # C0412
    "consider-using-enumerate",      # C0200
    "consider-using-dict-items",     # C0206
    "unnecessary-lambda-assignment", # C3001

    # Refactoring checks
    "duplicate-code",                # R0801 - abstract bases share patterns
    "cyclic-import",                 # R0401
    "consider-using-from-import",    # R0402
    "too-few-public-methods",        # R0903
    "too-many-public-methods",       # R0904
    "too-many-instance-attributes",  # R0902
    "too-many-arguments",            # R0913
    "too-many-positional-arguments", # R0917
    "too-many-locals",               # R0914
    "too-many-branches",             # R0912
    "too-many-statements",           # R0915
    "too-many-return-statements",    # R0911
    "too-many-nested-blocks",        # R1702
    "no-else-return",                # R1705
    "no-else-raise",                 # R1720
    "inconsistent-return-statements", # R1710
    "unnecessary-comprehension",     # R1721
    "consider-using-generator",      # R1728
    "use-a-generator",               # R1729
    "use-yield-from",                # R1737
    "consider-merging-isinstance",   # R1701
    "consider-using-in",             # R1714

    # Warning checks
    "protected-access",              # W0212 - tightly coupled internal code
    "unused-argument",               # W0613 - common in method overrides
    "redefined-outer-name",          # W0621
    "broad-exception-caught",        # W0718
    "fixme",                         # W0511
    "cell-var-from-loop",            # W0640
    "arguments-differ",              # W0221 - common in inheritance
    "attribute-defined-outside-init", # W0201
    "super-init-not-called",         # W0231
    "unnecessary-pass",              # W0107
    "unnecessary-ellipsis",          # W2301
    "logging-fstring-interpolation", # W1203
    "keyword-arg-before-vararg",     # W1113
    "raise-missing-from",            # W0707
    "wildcard-import",               # W0401
    "reimported",                    # W0404
    "pointless-string-statement",    # W0105
    "f-string-without-interpolation", # W1309
    "implicit-str-concat",           # W1404

    # Error checks - false positives from dynamic/optional imports
    "no-name-in-module",             # E0611 - qiskit/qulacs version-specific APIs
    "no-member",                     # E1101 - dynamic attributes
    "import-error",                  # E0401 - optional dependencies
    "possibly-used-before-assignment", # E0606 - code path analysis
]

[tool.pytest.ini_options]
testpaths = ["tests"]
