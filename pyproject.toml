[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "executor"
readme = "README.md"
authors = [
    {name = "David Kreplin", email = "david.kreplin@ipa.fraunhofer.de"},
    {name = "Moritz Willmann", email = "moritz.willmann@ipa.fraunhofer.de"},
    {name = "Jan Schnabel", email = "jan.schnabel@ipa.fraunhofer.de"},
    {name = "Manuel Hagelüken", email = "manuel.hagelueken@ipa.fraunhofer.de"},
    {name = "Marco Roth", email = "marco.roth@ipa.fraunhofer.de"},
]
maintainers = [
    {name = "David Kreplin", email = "david.kreplin@ipa.fraunhofer.de"},
    {name = "Moritz Willmann", email = "moritz.willmann@ipa.fraunhofer.de"},
]
license = {file = "LICENSE.txt"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["quantum", "circuit", "executor"]
dependencies = [
    "dill>=0.3.4",
    "mapomatic>=0.10.0",
    "numpy>=1.20",
    "pennylane>=0.34.0",
    "qiskit>=0.45.0,<2",
    "qiskit-aer>=0.12.0",
    "qiskit-algorithms>=0.3.0",
    "qiskit-ibm-runtime>=0.18.0",
    "qulacs>=0.6.4.1",
]
requires-python = ">=3.9,<3.13"
dynamic = ["version", "description"]

[project.optional-dependencies]
dev = [
    "black",
    "flit",
    "nbmake",
    "pylint",
    "pytest",
]

[tool.black]
line-length=99

[tool.pylint]
max-line-length=99

[tool.pylint.main]
extension-pkg-allow-list = [
    "numpy",
]
